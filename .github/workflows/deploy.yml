on:
  push:
    branches:
      - monolithic-political
name: 🚀 Deploy website on push 

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Use Node.js 16
        uses: actions/setup-node@v2-beta
        with:
          node-version: "16.14.0"

      - name: 🔨 Build Project
        run: |
          npm install
          npm run build --prod
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.1.0
        with:
          server: ${{ secrets.FTP_SERVER_POLITIC }}
          username: ${{ secrets.FTP_USER_POLITIC }}
          password: ${{ secrets.FTP_PASSWORD_POLITIC }}
          local-dir: ./dist/
          dangerous-clean-slate: true # optional